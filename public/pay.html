<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FishMarket — Pagar</title>
<link rel="stylesheet" href="/payment-common.css" />
</head>
<body>

  <div class="card" id="form-view">
    <h1>FishMarket</h1>
    <p class="subtitle">Pago del pedido — Grupo 6 (Pagos)</p>

    <label for="token">Token JWT (Auth Grupo 2)</label>
    <input id="token" type="text" placeholder="Pega aquí el JWT (Bearer token)" />
    <div style="display:flex; gap:8px; margin-top:6px;">
      <input id="login-email" type="email" placeholder="Email de prueba" style="flex:1;" />
      <input id="login-password" type="password" placeholder="Contraseña" style="flex:1;" />
    </div>
    <button type="button" onclick="doLogin()" style="background:transparent; border:1px solid rgba(255,255,255,0.2); color:var(--text); margin-top:8px;">
      Obtener token (login Grupo 2)
    </button>

    <label for="orderId">Order ID (órdenes de Grupo 5 vía RabbitMQ)</label>
    <select id="orderId-select" onchange="onOrderSelect()">
      <option value="">— Cargando órdenes… —</option>
      <option value="__manual__">Escribir manualmente</option>
    </select>
    <input id="orderId" type="text" placeholder="ej: f38b9fa7-9f4b-45e0-a1f2-2ff470d53b58" style="display:none; margin-top:8px;" />

    <label for="amount">Monto (CLP)</label>
    <input id="amount" type="number" value="5000" min="1" />

    <label for="description">Descripción</label>
    <input id="description" type="text" value="Pedido FishMarket" />

    <label for="email">Email del pagador</label>
    <input id="email" type="email" value="alumno@universidad.cl" />

    <button id="pay-btn" onclick="startPayment()">Pagar con Mercado Pago</button>
    <p class="error" id="error-msg"></p>

    <p class="footer-note">Checkout Pro — Mercado Pago</p>
  </div>

<script>
  const API_BASE = window.location.origin + '/api/payments';

  // ⚠️ AJUSTA ESTO con Grupo 2: URL exacta, nombres de campos del body,
  // y el nombre del campo del token en la respuesta (token / access_token / jwt / data.token).
  const AUTH_LOGIN_URL = 'https://auth-minimarket-cloud.onrender.com/auth/login';

  async function doLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if (!email || !password) {
      showError('Ingresa email y contraseña de prueba para hacer login.');
      return;
    }
    try {
      const res = await fetch(AUTH_LOGIN_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();
      if (!res.ok) {
        showError(data.error || 'No se pudo iniciar sesión en Auth (Grupo 2).');
        return;
      }
      // Intenta varios nombres de campo comunes — ajusta según lo que Grupo 2 confirme.
      const token = data.token || data.access_token || data.jwt || data?.data?.token;
      if (!token) {
        showError('Login OK pero no encontré el campo del token en la respuesta. Revisa la consola (F12).');
        console.log('[Auth login] respuesta completa:', data);
        return;
      }
      document.getElementById('token').value = token;
      sessionStorage.setItem('demoToken', token);
    } catch (err) {
      showError('Error de red al hacer login contra Auth (Grupo 2).');
    }
  }

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function onOrderSelect() {
    const select = document.getElementById('orderId-select');
    const manualInput = document.getElementById('orderId');
    if (select.value === '__manual__') {
      manualInput.style.display = 'block';
      manualInput.value = '';
      manualInput.focus();
    } else {
      manualInput.style.display = 'none';
      manualInput.value = select.value;
    }
  }

  async function loadPendingOrders() {
    const select = document.getElementById('orderId-select');
    try {
      const res = await fetch(API_BASE + '/pending-orders');
      const orders = await res.json();
      select.innerHTML = '';

      if (!res.ok || !Array.isArray(orders) || orders.length === 0) {
        select.innerHTML = '<option value="">— Sin órdenes recibidas aún —</option><option value="__manual__">Escribir manualmente</option>';
        return;
      }

      const emptyOpt = document.createElement('option');
      emptyOpt.value = '';
      emptyOpt.textContent = `— Selecciona una orden (${orders.length}) —`;
      select.appendChild(emptyOpt);

      orders.forEach((o) => {
        const opt = document.createElement('option');
        opt.value = o.orderId;
        const label = o.orderNumber ? `${o.orderNumber} — ` : '';
        const amount = o.amount ? ` — $${Number(o.amount).toLocaleString('es-CL')}` : '';
        opt.textContent = `${label}${o.orderId.slice(0, 8)}…${amount}`;
        select.appendChild(opt);
      });

      const manualOpt = document.createElement('option');
      manualOpt.value = '__manual__';
      manualOpt.textContent = 'Escribir manualmente';
      select.appendChild(manualOpt);
    } catch (err) {
      select.innerHTML = '<option value="">— Error al cargar órdenes —</option><option value="__manual__">Escribir manualmente</option>';
    }
  }

  // Carga las órdenes al abrir la página, y refresca cada 10s por si llega una nueva
  loadPendingOrders();
  setInterval(loadPendingOrders, 10000);

  // Recupera el token guardado de una sesión anterior en este mismo navegador
  (function restoreToken() {
    const saved = sessionStorage.getItem('demoToken');
    if (saved) document.getElementById('token').value = saved;
  })();

  async function startPayment() {
    const amount = Number(document.getElementById('amount').value);
    const description = document.getElementById('description').value;
    const payerEmail = document.getElementById('email').value;
    const token = document.getElementById('token').value.trim();
    const orderSelect = document.getElementById('orderId-select');
    const orderIdInput = orderSelect.value === '__manual__'
      ? document.getElementById('orderId').value.trim()
      : orderSelect.value.trim();
    const btn = document.getElementById('pay-btn');

    if (!token) {
      showError('Falta el token JWT (pídelo a Grupo 2 / haz login primero).');
      return;
    }
    if (!amount || amount <= 0) {
      showError('El monto debe ser mayor a 0.');
      return;
    }
    const uuidPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    if (orderIdInput && !uuidPattern.test(orderIdInput)) {
      showError('El Order ID no tiene formato UUID válido. Pídele el id correcto a Grupo 5.');
      return;
    }

    sessionStorage.setItem('demoToken', token);
    btn.disabled = true;
    btn.textContent = 'Generando pago…';

    // Usa el orderId real de Grupo 5 si lo escribiste; si lo dejas vacío,
    // genera uno de prueba (para no depender de Grupo 5 mientras debuggeas).
    const orderId = orderIdInput || ('demo-' + crypto.randomUUID());

    try {
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token,
          'Idempotency-Key': 'demo-' + Date.now(),
        },
        body: JSON.stringify({ amount, currency: 'CLP', description, payerEmail, orderId }),
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'No se pudo crear el pago.');
        btn.disabled = false;
        btn.textContent = 'Pagar con Mercado Pago';
        return;
      }

      if (!data.initPoint) {
        showError('El pago se creó, pero Mercado Pago no devolvió un link de pago (revisa MP_ACCESS_TOKEN).');
        btn.disabled = false;
        btn.textContent = 'Pagar con Mercado Pago';
        return;
      }

      // Guardamos el id del pago por si el redirect de MP no trae external_reference
      sessionStorage.setItem('demoPaymentId', data.id);
      window.location.href = data.initPoint;
    } catch (err) {
      showError('Error de red al contactar el servicio de pagos.');
      btn.disabled = false;
      btn.textContent = 'Pagar con Mercado Pago';
    }
  }
</script>
</body>
</html>
