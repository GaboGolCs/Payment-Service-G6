<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FishMarket — Demo de Pago</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #06b6d4;
    --accent-dark: #0891b2;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --approved: #22c55e;
    --rejected: #ef4444;
    --pending: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(160deg, var(--bg), #111827);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 32px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.06);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; margin-top: 14px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.12);
    background: #0f172a;
    color: var(--text);
    font-size: 14px;
  }
  input:focus { outline: 2px solid var(--accent); }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #0f172a;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error { color: var(--rejected); font-size: 13px; margin-top: 10px; display: none; }

  .status-icon {
    width: 64px; height: 64px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin: 0 auto 16px;
  }
  .status-approved .status-icon { background: rgba(34,197,94,0.15); color: var(--approved); }
  .status-rejected .status-icon { background: rgba(239,68,68,0.15); color: var(--rejected); }
  .status-pending .status-icon  { background: rgba(245,158,11,0.15); color: var(--pending); }

  .result-title { text-align: center; font-size: 22px; margin: 0 0 6px; }
  .result-sub { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .detail-row {
    display: flex; justify-content: space-between;
    font-size: 13px; padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .detail-row span:first-child { color: var(--muted); }
  .badge {
    display: inline-block; padding: 2px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px;
  }
  .badge-approved { background: rgba(34,197,94,0.15); color: var(--approved); }
  .badge-rejected { background: rgba(239,68,68,0.15); color: var(--rejected); }
  .badge-pending  { background: rgba(245,158,11,0.15); color: var(--pending); }

  .footer-note { text-align: center; color: var(--muted); font-size: 11px; margin-top: 20px; }
  .spinner {
    width: 36px; height: 36px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite; margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

  <div class="card" id="form-view">
    <h1>FishMarket</h1>
    <p class="subtitle">Demo — Pago del servicio (Grupo 6)</p>

    <label for="amount">Monto (CLP)</label>
    <input id="amount" type="number" value="5000" min="1" />

    <label for="description">Descripción</label>
    <input id="description" type="text" value="Demo de pago — FishMarket" />

    <label for="email">Email del pagador</label>
    <input id="email" type="email" value="alumno@universidad.cl" />

    <button id="pay-btn" onclick="startPayment()">Pagar con Mercado Pago</button>
    <p class="error" id="error-msg"></p>

    <p class="footer-note">Ambiente de demostración — Checkout Pro (Mercado Pago)</p>
  </div>

  <div class="card" id="loading-view" style="display:none; text-align:center;">
    <div class="spinner"></div>
    <p class="subtitle" style="margin:0;">Verificando el resultado del pago…</p>
  </div>

  <div class="card" id="result-view" style="display:none;"></div>

<script>
  const API_BASE = window.location.origin + '/api/payments';

  function showError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg;
    el.style.display = 'block';
  }

  async function startPayment() {
    const amount = Number(document.getElementById('amount').value);
    const description = document.getElementById('description').value;
    const payerEmail = document.getElementById('email').value;
    const btn = document.getElementById('pay-btn');

    if (!amount || amount <= 0) {
      showError('El monto debe ser mayor a 0.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Generando pago…';

    // orderId de demo con formato UUID válido, para no romper el consumer de Grupo 5
    const demoOrderId = 'demo-' + crypto.randomUUID();

    try {
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Idempotency-Key': 'demo-' + Date.now(),
        },
        body: JSON.stringify({ amount, currency: 'CLP', description, payerEmail, orderId: demoOrderId }),
      });

      const data = await res.json();

      if (!res.ok) {
        showError(data.error || 'No se pudo crear el pago.');
        btn.disabled = false;
        btn.textContent = 'Pagar con Mercado Pago';
        return;
      }

      if (!data.initPoint) {
        showError('El pago se creó, pero Mercado Pago no devolvió un link de pago (revisa MP_ACCESS_TOKEN).');
        btn.disabled = false;
        btn.textContent = 'Pagar con Mercado Pago';
        return;
      }

      // Guardamos el id del pago para poder consultarlo cuando MP nos redirija de vuelta
      sessionStorage.setItem('demoPaymentId', data.id);
      window.location.href = data.initPoint;
    } catch (err) {
      showError('Error de red al contactar el servicio de pagos.');
      btn.disabled = false;
      btn.textContent = 'Pagar con Mercado Pago';
    }
  }

  function statusMeta(status) {
    switch (status) {
      case 'APPROVED':
        return { cls: 'status-approved', badge: 'badge-approved', icon: '✓', title: '¡Pago aprobado!', sub: 'La transacción se completó correctamente.' };
      case 'REJECTED':
        return { cls: 'status-rejected', badge: 'badge-rejected', icon: '✕', title: 'Pago rechazado', sub: 'La transacción no pudo completarse.' };
      default:
        return { cls: 'status-pending', badge: 'badge-pending', icon: '⏳', title: 'Pago pendiente', sub: 'Estamos esperando la confirmación de Mercado Pago.' };
    }
  }

  function renderResult(payment) {
    const meta = statusMeta(payment.status);
    const view = document.getElementById('result-view');
    view.className = 'card ' + meta.cls;
    view.innerHTML = `
      <div class="status-icon">${meta.icon}</div>
      <h2 class="result-title">${meta.title}</h2>
      <p class="result-sub">${meta.sub}</p>
      <div class="detail-row"><span>Estado</span><span class="badge ${meta.badge}">${payment.status}</span></div>
      <div class="detail-row"><span>Monto</span><span>${payment.currency} $${payment.amount.toLocaleString('es-CL')}</span></div>
      <div class="detail-row"><span>ID de pago</span><span>${payment.id.slice(0, 13)}…</span></div>
      <div class="detail-row"><span>Order ID</span><span>${(payment.orderId || '—').slice(0, 20)}</span></div>
      <button onclick="resetDemo()">Hacer otro pago de prueba</button>
      <p class="footer-note">Ambiente de demostración — Checkout Pro (Mercado Pago)</p>
    `;
    view.style.display = 'block';
    document.getElementById('loading-view').style.display = 'none';
  }

  async function confirmPaymentManually(paymentId) {
    try {
      const res = await fetch(API_BASE + '/' + paymentId + '/confirm', { method: 'POST' });
      const payment = await res.json();
      if (!res.ok) {
        showError(payment.error || 'No se pudo confirmar el pago.');
        return;
      }
      renderResult(payment);
    } catch (err) {
      showError('Error de red al confirmar el pago.');
    }
  }

  function renderPollingTimeout(paymentId) {
    const view = document.getElementById('result-view');
    view.className = 'card status-pending';
    view.innerHTML = `
      <div class="status-icon">⏳</div>
      <h2 class="result-title">Aún procesando</h2>
      <p class="result-sub">Mercado Pago todavía no confirma el estado final. Puedes reintentar la consulta, o simular la confirmación manualmente (backoffice).</p>
      <button onclick="pollPaymentStatus('${paymentId}')">Reintentar consulta</button>
      <button onclick="confirmPaymentManually('${paymentId}')" style="background:var(--pending); margin-top:10px;">Simular confirmación (backoffice)</button>
      <button onclick="resetDemo()" style="background:transparent; border:1px solid rgba(255,255,255,0.2); color:var(--text); margin-top:10px;">Volver al inicio</button>
    `;
    view.style.display = 'block';
    document.getElementById('loading-view').style.display = 'none';
  }

  async function pollPaymentStatus(paymentId, attempt = 0) {
    document.getElementById('loading-view').style.display = 'block';
    document.getElementById('result-view').style.display = 'none';
    try {
      const res = await fetch(API_BASE + '/' + paymentId);
      const payment = await res.json();
      if (!res.ok) {
        showError(payment.error || 'No se encontró el pago.');
        resetDemo();
        return;
      }
      if (payment.status === 'PENDING' && attempt < 5) {
        // Reintenta cada 2s por si el webhook aún no llega (máx ~10s)
        setTimeout(() => pollPaymentStatus(paymentId, attempt + 1), 2000);
        return;
      }
      if (payment.status === 'PENDING') {
        renderPollingTimeout(paymentId);
        return;
      }
      renderResult(payment);
    } catch (err) {
      showError('Error de red al consultar el pago.');
      resetDemo();
    }
  }

  function resetDemo() {
    sessionStorage.removeItem('demoPaymentId');
    document.getElementById('result-view').style.display = 'none';
    document.getElementById('loading-view').style.display = 'none';
    document.getElementById('form-view').style.display = 'block';
    document.getElementById('error-msg').style.display = 'none';
    // Limpia los query params de MP en la URL
    window.history.replaceState({}, '', window.location.pathname);
  }

  // Al cargar: si venimos de vuelta de Mercado Pago (o tenemos un pago guardado), consultamos su estado
  (function init() {
    const params = new URLSearchParams(window.location.search);
    const externalRef = params.get('external_reference');
    const savedId = sessionStorage.getItem('demoPaymentId');
    const paymentId = externalRef || savedId;

    if (paymentId) {
      document.getElementById('form-view').style.display = 'none';
      pollPaymentStatus(paymentId);
    }
  })();
</script>
</body>
</html>
